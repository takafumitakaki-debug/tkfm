<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>動画 確認ページ</title>
<style>
  :root { --bg: #fafaf8; --fg: #1d1d1b; --muted: #6b6b66; --line: #deded8; --card: #fff; --accent: #2f6fdb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ecece8; --muted: #9a9a94; --line: #33332f; --card: #1f1f1d; --accent: #7aa7ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.7 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 32px 16px 80px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 32px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
  section h2 { font-size: 1.15rem; margin: 0 0 4px; }
  .date { color: var(--muted); font-size: .85rem; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .grid figure { margin: 0; }
  .grid img, video { width: 100%; border-radius: 8px; display: block; }
  figcaption { font-size: .85rem; color: var(--muted); margin-top: 4px; }
  .ok { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>動画 確認ページ</h1>
  <p class="lead">工程の節目ごとに下へ節を追記していきます。過去の節は消しません。</p>

  <section id="s01">
    <h2>01 準備と料金の目安</h2>
    <p class="date">2026-10-07</p>
    <p>見積りのもとにする単価です(Google の公表価格をもとにした目安。2026-10-07 時点)。</p>
    <table>
      <tr><th>用途</th><th>モデル</th><th>目安の単価</th></tr>
      <tr><td>画像</td><td>gemini-3-pro-image</td><td>1K〜2K:約 $0.134 / 枚、4K:約 $0.24 / 枚</td></tr>
      <tr><td>動画</td><td>gemini-omni-flash-preview</td><td>720p:約 $0.10 / 秒(無料枠なし)</td></tr>
    </table>
  </section>
</main>
</body>
</html>
