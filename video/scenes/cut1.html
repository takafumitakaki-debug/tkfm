<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>カット1 理念:夜明けの出発</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <!-- 紙 -->
  <rect x="-1000" y="-1000" width="4000" height="4000" fill="#f4efe4"/>

  <!-- 夜明けの空(水彩) -->
  <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5f7fa6"/>
    <stop offset="0.6" stop-color="#9fb3c8"/>
    <stop offset="1" stop-color="#efc9a0"/>
  </linearGradient>
  <rect class="wash" data-fade="0 1.4" x="-200" y="-400" width="2400" height="1230" fill="url(#dawn)" opacity="0.75"/>

  <!-- 明けの細い月 -->
  <path class="wash" data-fade="0.8 1.2" data-out="3.5 2.0" d="M1290 200 a46 46 0 1 0 40 70 a36 36 0 1 1 -40 -70 Z" fill="#fbf3dc" opacity="0.95"/>
  <path class="line thin" data-draw="0.8 0.8" pathLength="1" d="M1290 200 a46 46 0 1 0 40 70 a36 36 0 1 1 -40 -70 Z"/>

  <!-- 地面 -->
  <rect class="wash" data-fade="0.6 1.2" x="-200" y="820" width="2400" height="900" fill="#b9ad98" opacity="0.6"/>
  <path class="line" data-draw="0.2 1.2" pathLength="1" d="M-100 822 C 300 818, 700 826, 1100 820 S 1800 824, 2100 821"/>

  <!-- 電柱と電線 -->
  <path class="line soft" data-draw="0.8 1.0" pathLength="1" d="M1480 822 L1490 380 M1440 420 L1540 416 M1452 450 L1528 447"/>
  <path class="line soft thin" data-draw="1.2 1.4" pathLength="1" d="M1100 470 C 1250 500, 1380 470, 1486 420 C 1650 460, 1850 450, 2050 430"/>

  <!-- 倉庫 -->
  <rect class="wash" data-fade="1.2 1.2" x="360" y="440" width="740" height="382" fill="#c9cfd3" opacity="0.7"/>
  <path class="line" data-draw="0.4 1.6" pathLength="1" d="M340 446 L730 362 L1122 446"/>
  <path class="line" data-draw="0.7 1.4" pathLength="1" d="M362 442 L360 822 M1100 442 L1103 822"/>
  <!-- シャッター -->
  <path class="line" data-draw="1.1 1.0" pathLength="1" d="M520 822 L521 560 L822 561 L820 822"/>
  <path class="line soft thin" data-draw="1.5 1.0" pathLength="1" d="M523 590 H818 M523 620 H818 M523 650 H818 M523 680 H818 M523 710 H818 M523 740 H818 M523 770 H818 M523 800 H818"/>
  <!-- 看板(ロゴは仕上げで本物を入れる) -->
  <path class="line thin" data-draw="1.3 0.8" pathLength="1" d="M600 470 H900 V522 H600 Z"/>
  <!-- 灯りのついた窓:夜明け前から人が働いている -->
  <rect class="wash" data-fade="2.0 0.8" x="904" y="524" width="112" height="76" fill="#f2b85c" opacity="0.9"/>
  <path class="line thin" data-draw="1.6 0.8" pathLength="1" d="M902 522 H1018 V602 H902 Z M960 522 V602"/>

  <!-- トラック -->
  <g id="truck" class="solid">
    <g>
      <polygon class="wash" data-fade="3.0 0.6" points="1000,735 1320,690 1320,800 1000,765" fill="#f6dc8a" opacity="0.8"/>
      <rect class="wash" data-fade="2.7 0.3" x="562" y="612" width="296" height="178" fill="#f7f4ee" opacity="1"/>
      <path class="wash" data-fade="2.8 0.3" d="M860 790 V660 H950 L1000 720 V790 Z" fill="#4f78a8" opacity="0.9"/>
    </g>
    <g class="ink">
      <path class="line" data-draw="1.6 0.9" pathLength="1" d="M560 790 L561 610 L860 611 L860 790 Z"/>
      <path class="line" data-draw="1.9 0.7" pathLength="1" d="M860 790 V660 H950 L1000 720 V790 Z"/>
      <path class="line thin" data-draw="2.3 0.6" pathLength="1" d="M875 675 H940 L975 718 H875 Z"/>
      <path class="line thin" data-draw="2.4 0.5" pathLength="1" d="M550 792 H1010"/>
      <circle class="line" data-draw="2.4 0.6" pathLength="1" cx="640" cy="800" r="32"/>
      <circle class="line" data-draw="2.5 0.6" pathLength="1" cx="930" cy="800" r="32"/>
      <circle class="line thin" data-draw="2.7 0.4" pathLength="1" cx="640" cy="800" r="10"/>
      <circle class="line thin" data-draw="2.8 0.4" pathLength="1" cx="930" cy="800" r="10"/>
    </g>
  </g>

  <!-- 排気のけむり -->
  <g id="smoke">
    <circle class="line soft thin" pathLength="1" cx="0" cy="0" r="10"/>
    <circle class="line soft thin" pathLength="1" cx="0" cy="0" r="14"/>
    <circle class="line soft thin" pathLength="1" cx="0" cy="0" r="18"/>
  </g>

  <!-- 章ラベル -->
  <g id="label" data-fade="0.6 1.0">
    <text class="hand" x="0" y="0" font-size="64">01</text>
    <text class="hand" x="96" y="-4" font-size="40">理念</text>
    <path class="line thin" data-draw="1.0 0.8" pathLength="1" d="M0 22 C 60 18, 120 26, 190 20"/>
  </g>
</svg>

<script>
  window.SCENE = {
    duration: 6,
    // 横長 1920x1080 / 縦長は倉庫とトラックが入る範囲を 9:16 で切り出す
    view: { h: [0, 0, 1920, 1080], v: [330, 40, 810, 1440] },
    update(t, aspect) {
      // 3.2 秒から走り出し、だんだん加速して画面の外へ
      const run = Math.max(0, t - 3.2) / 2.8;
      const x = 1500 * run ** 2.2;
      const bump = run > 0 ? Math.sin(t * 22) * 1.5 : 0;
      document.getElementById('truck').setAttribute('transform', `translate(${x} ${bump})`);

      // けむり:車の後ろから出て、上に流れて消える
      const smoke = document.getElementById('smoke');
      [...smoke.children].forEach((c, i) => {
        const age = ((t - 3.2 - i * 0.25) % 0.9 + 0.9) % 0.9;
        const on = t > 3.2 + i * 0.25;
        c.setAttribute('cx', 548 + x - age * 120);
        c.setAttribute('cy', 775 - age * 60);
        c.style.opacity = on ? String(0.8 * (1 - age / 0.9)) : '0';
      });

      const label = document.getElementById('label');
      label.setAttribute('transform', aspect === 'v' ? 'translate(380 1390)' : 'translate(110 990)');
    },
  };
</script>
<script type="module" src="engine.js"></script>
</body>
</html>
