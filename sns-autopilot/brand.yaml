# AI が投稿文を書くときのブランド設定。アカウントに合わせて書き換える。
name: サンプル食堂
description: 地元の食材を使った定食屋。季節の限定メニューとテイクアウトが人気
audience: 近隣で働く20〜50代、家族連れ
tone: 親しみやすく、押しつけがましくない。です・ます調

rules:
  - 一文を短くし、専門用語を避ける
  - 季節感や作り手の工夫を具体的に一つ入れる
  - 誇張した表現（「絶対」「日本一」など）は使わない

ng_words:
  - 絶対
  - 日本一
  - 激安

emoji: 1投稿に2〜3個まで
max_hashtags: 10
fixed_hashtags:
  - "#サンプル食堂"

instagram_cta: プロフィールのリンクから営業時間を確認できることを案内
line_cta: 予約・お問い合わせは このトークで受け付けていることを案内
