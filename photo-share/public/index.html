<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TKFM Share">
  <meta name="robots" content="noindex, nofollow">
  <title>TKFM Share</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <header class="bar" id="bar">
    <button class="bar-back" id="bar-back" hidden aria-label="戻る">‹</button>
    <h1 class="bar-title" id="bar-title">TKFM Share</h1>
    <div class="bar-actions" id="bar-actions"></div>
  </header>
  <main id="view" class="view"></main>

  <section class="uploads" id="uploads" hidden aria-live="polite"></section>

  <div class="viewer" id="viewer" hidden>
    <div class="viewer-top">
      <button class="viewer-btn" id="v-close" aria-label="閉じる">✕</button>
      <span class="viewer-count" id="v-count"></span>
      <span class="spacer"></span>
    </div>
    <div class="viewer-stage" id="v-stage"></div>
    <button class="viewer-nav prev" id="v-prev" aria-label="前へ">‹</button>
    <button class="viewer-nav next" id="v-next" aria-label="次へ">›</button>
    <div class="viewer-bottom">
      <div class="viewer-info" id="v-info"></div>
      <div class="viewer-tools">
        <button class="viewer-btn" id="v-full" hidden>元の画質で表示</button>
        <button class="viewer-btn" id="v-save">保存</button>
        <button class="viewer-btn danger" id="v-delete" hidden>削除</button>
      </div>
    </div>
  </div>

  <dialog class="sheet" id="dialog"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
