<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>比較ナビ</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #677085; --line: #e3e6ec;
    --accent: #2357d9; --accent-weak: #e8eefc; --good: #137a4b; --warn: #b4560f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --card: #1b2029; --text: #e8ebf2; --muted: #98a1b3; --line: #2c3340;
      --accent: #7aa2ff; --accent-weak: #1f2a44; --good: #4cc98d; --warn: #f0a35e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.6; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  form { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  input, select, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); min-width: 0; }
  button { background: var(--accent); color: #fff; border: 0; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  @media (max-width: 640px) { form { grid-template-columns: 1fr 1fr; } form input[name=q] { grid-column: 1 / -1; } form button { grid-column: 1 / -1; } }
  .status { margin: 16px 0; color: var(--muted); font-size: .9rem; }
  .status .err { color: var(--warn); }
  .badge { display: inline-block; font-size: .75rem; padding: 1px 8px; border-radius: 99px;
    background: var(--accent-weak); color: var(--accent); margin-right: 4px; white-space: nowrap; }
  .badge.demo { background: #fff1e0; color: #a14d00; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .top { border: 2px solid var(--accent); }
  .top-label { font-weight: 700; color: var(--accent); font-size: .85rem; margin-bottom: 4px; }
  .head { display: grid; grid-template-columns: 88px 1fr auto; gap: 14px; align-items: start; }
  .thumb { width: 88px; height: 88px; border-radius: 8px; background: var(--bg); object-fit: contain; border: 1px solid var(--line); }
  .title { font-weight: 600; margin: 0 0 4px; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: .85rem; }
  .price { text-align: right; white-space: nowrap; }
  .price b { font-size: 1.3rem; }
  .score { font-size: .8rem; color: var(--muted); }
  ul.reasons { margin: 10px 0 0; padding-left: 1.2em; color: var(--good); font-size: .9rem; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--accent); font-size: .9rem; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; margin-top: 8px; min-width: 560px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; white-space: normal; }
  tr.best td { background: var(--accent-weak); }
  a { color: var(--accent); }
  @media (max-width: 640px) { .head { grid-template-columns: 64px 1fr; } .thumb { width: 64px; height: 64px; } .price { grid-column: 1 / -1; text-align: left; } }
  .note { color: var(--muted); font-size: .8rem; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>比較ナビ</h1>
  <p class="lead">欲しいものを入力すると、複数のショップから同じ項目（価格・送料・ポイント・評価・レビュー数）を集めて、同じ商品ごとにまとめて比較・おすすめします。</p>

  <form id="f">
    <input name="q" placeholder="例：ワイヤレスイヤホン ノイズキャンセリング" required autofocus>
    <input name="budget" type="number" min="0" step="100" placeholder="予算（円）">
    <select name="priority">
      <option value="balance">バランス</option>
      <option value="price">安さ重視</option>
      <option value="rating">評価重視</option>
    </select>
    <button>比較する</button>
  </form>

  <div id="status" class="status"></div>
  <div id="results"></div>

  <p class="note">実質価格 ＝ 本体価格 ＋ 送料 − ポイント。送料が「別」でAPIから金額が取れない場合は0円として計算し、表に「別」と表示します。価格・在庫は各ショップでご確認ください。</p>
</main>

<script>
const $ = (sel) => document.querySelector(sel);
const yen = (n) => '¥' + Math.round(n).toLocaleString();

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (v != null && v !== false) node.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null) node.append(c instanceof Node ? c : String(c));
  return node;
}

function safeUrl(u) {
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; }
}

function offerTable(item) {
  const rows = item.offers.map((o, i) => el('tr', { class: i === 0 ? 'best' : '' },
    el('td', {}, safeUrl(o.url) ? el('a', { href: safeUrl(o.url), target: '_blank', rel: 'noopener' }, o.shop || '(ショップ名なし)') : (o.shop || '-'),
      ' ', el('span', { class: 'badge' }, o.sourceLabel), o.available ? null : el('span', { class: 'badge demo' }, '在庫なし')),
    el('td', {}, yen(o.price)),
    el('td', {}, o.shipping === 0 ? '無料' : o.shipping == null ? '別' : yen(o.shipping)),
    el('td', {}, o.points ? o.points.toLocaleString() + 'pt' : '-'),
    el('td', {}, el('b', {}, yen(o.effectivePrice))),
    el('td', {}, o.rating ? `★${o.rating.toFixed(2)}` : '-'),
    el('td', {}, o.reviewCount.toLocaleString()),
  ));
  return el('div', { class: 'table-wrap' }, el('table', {},
    el('thead', {}, el('tr', {}, ...['ショップ', '本体', '送料', 'ポイント', '実質', '評価', 'レビュー'].map((h) => el('th', {}, h)))),
    el('tbody', {}, rows)));
}

function itemCard(item, rank) {
  const img = safeUrl(item.image);
  return el('div', { class: 'card' + (rank === 0 ? ' top' : '') },
    rank === 0 ? el('div', { class: 'top-label' }, 'いちばんのおすすめ') : null,
    el('div', { class: 'head' },
      img ? el('img', { class: 'thumb', src: img, alt: '', loading: 'lazy' }) : el('div', { class: 'thumb' }),
      el('div', {},
        el('p', { class: 'title' }, `${rank + 1}. ${item.title}`),
        el('div', { class: 'meta' },
          item.rating ? `★${item.rating.toFixed(2)}（${item.reviewCount.toLocaleString()}件）・` : 'レビューなし・',
          `${item.shopCount}ショップ`, ' ', ...item.sources.map((s) => el('span', { class: 'badge' }, s)))),
      el('div', { class: 'price' },
        el('div', { class: 'meta' }, '最安（実質）'), el('b', {}, yen(item.bestOffer.effectivePrice)),
        item.maxPrice > item.minPrice ? el('div', { class: 'meta' }, `〜${yen(item.maxPrice)}`) : null,
        el('div', { class: 'score' }, `おすすめ度 ${item.score}`))),
    item.reasons.length ? el('ul', { class: 'reasons' }, item.reasons.map((r) => el('li', {}, r))) : null,
    el('details', rank === 0 ? { open: '' } : {}, el('summary', {}, `ショップ別に比較（${item.offers.length}件）`), offerTable(item)));
}

function renderStatus(data) {
  const s = $('#status');
  s.replaceChildren(
    `「${data.query}」：${data.totalOffers}件の出品を収集 → ${data.items.length}商品に整理（${data.priority}）`,
    data.overBudgetCount ? `／予算オーバー ${data.overBudgetCount}商品を除外` : '',
    el('br'),
    ...data.sources.map((src) => src.ok
      ? el('span', { class: 'badge' + (src.demo ? ' demo' : '') }, `${src.label} ${src.count}件`)
      : el('span', { class: 'err' }, `${src.label}：取得失敗（${src.error}） `)),
    data.sources.some((x) => x.demo) ? el('div', { class: 'err' }, '※デモデータは架空の商品です。APIキーを設定すると実際のショップから収集します（README参照）。') : '',
  );
}

$('#f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const params = new URLSearchParams([...fd].filter(([, v]) => v !== ''));
  history.replaceState(null, '', '?' + params);
  const btn = e.target.querySelector('button');
  btn.disabled = true; btn.textContent = '収集中…';
  $('#status').textContent = '各ショップから収集しています…';
  $('#results').replaceChildren();
  try {
    const res = await fetch('/api/search?' + params);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    renderStatus(data);
    $('#results').replaceChildren(...(data.items.length
      ? data.items.map(itemCard)
      : [el('div', { class: 'card' }, '条件に合う商品が見つかりませんでした。キーワードや予算を変えてみてください。')]));
  } catch (err) {
    $('#status').replaceChildren(el('span', { class: 'err' }, 'エラー：' + err.message));
  } finally {
    btn.disabled = false; btn.textContent = '比較する';
  }
});

// URLの検索条件を復元（共有リンク用）
const init = new URLSearchParams(location.search);
for (const [k, v] of init) { const f = $('#f').elements[k]; if (f) f.value = v; }
if (init.get('q')) $('#f').requestSubmit();
</script>
</body>
</html>
