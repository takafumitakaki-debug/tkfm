# 承認済み（status: approved）で予定時刻を過ぎた投稿を Instagram / LINE に公開する。
# 結果は sns-autopilot/state/state.json にコミットされ、二重投稿を防ぐ。
name: SNS publish

on:
  schedule:
    # 15分ごと。GitHub の混雑状況で数分〜十数分遅れることがある
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せずに対象だけ表示する"
        type: boolean
        default: false

permissions:
  contents: write

# 同時実行すると二重投稿の恐れがあるので必ず直列にする
concurrency:
  group: sns-publish
  cancel-in-progress: false

defaults:
  run:
    working-directory: sns-autopilot
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sns-autopilot/requirements.txt

      - run: pip install -r requirements.txt

      - name: Publish due posts
        id: publish
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION || 'v23.0' }}
          SNS_TIMEZONE: ${{ vars.SNS_TIMEZONE || 'Asia/Tokyo' }}
        run: python -m sns_autopilot publish ${{ inputs.dry_run && '--dry-run' || '' }}

      # 投稿が途中で失敗しても、成功した分の記録は必ずコミットする
      - name: Commit state
        if: always()
        run: |
          # 初回は state.json が未追跡なので、add してから差分を見る
          git add state/
          if git diff --cached --quiet; then
            echo "state に変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "sns: 投稿結果を記録"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          echo "::error::state.json を push できませんでした。二重投稿を防ぐため至急確認してください"
          exit 1

      - name: Fail if any post failed
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::error::投稿に失敗したものがあります。ログと state/state.json の errors を確認してください"
          exit 1
