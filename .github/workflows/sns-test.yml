name: SNS test

on:
  push:
    paths: ["sns-autopilot/**", ".github/workflows/sns-*.yml"]
  pull_request:
    paths: ["sns-autopilot/**", ".github/workflows/sns-*.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: sns-autopilot
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sns-autopilot/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      # 投稿ファイルの書式エラーをマージ前に検出する
      - run: python -m sns_autopilot validate
