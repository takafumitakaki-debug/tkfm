# 下書き（status: draft・本文が空）の投稿文を Claude で生成し、レビュー用の PR を作る。
# PR で文面を確認・修正し、status: approved にしてマージすると予約投稿の対象になる。
name: SNS generate captions

on:
  push:
    paths:
      - "sns-autopilot/posts/**"
  workflow_dispatch:
    inputs:
      post_id:
        description: "対象の投稿ID（空なら本文が空の下書きすべて）"
        required: false
      force:
        description: "本文が入っていても作り直す"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sns-generate
  cancel-in-progress: false

defaults:
  run:
    working-directory: sns-autopilot
    shell: bash

jobs:
  generate:
    # デフォルトブランチへの push と手動実行のときだけ動かす
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sns-autopilot/requirements.txt

      - run: pip install -r requirements.txt

      - name: Generate captions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
          SNS_TIMEZONE: ${{ vars.SNS_TIMEZONE || 'Asia/Tokyo' }}
          POST_ID: ${{ inputs.post_id }}
        run: |
          args=(--notes-file "$RUNNER_TEMP/notes.md")
          [ -n "$POST_ID" ] && args+=(--id "$POST_ID")
          [ "${{ inputs.force }}" = "true" ] && args+=(--force)
          python -m sns_autopilot generate "${args[@]}"

      - name: Open review PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- posts/; then
            echo "生成された本文はありません"
            exit 0
          fi
          branch="sns/captions-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add posts/
          git commit -m "sns: 投稿文を AI で生成"
          git push -u origin "$branch"
          {
            echo "AI が下書きの投稿文を生成しました。"
            echo
            echo "## 確認すること"
            echo "- [ ] 日付・価格・固有名詞が正しい（【要確認】が残っていない）"
            echo "- [ ] トーン・表現に問題がない"
            echo "- [ ] 投稿してよいものは \`status: approved\` に変更"
            echo
            echo "マージすると、approved の投稿は scheduled_at に自動投稿されます。"
            echo
            echo "## 申し送り"
            cat "$RUNNER_TEMP/notes.md" 2>/dev/null || echo "なし"
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
            --title "SNS 投稿文の確認 ($(date +%Y-%m-%d))" --body-file "$RUNNER_TEMP/body.md"
