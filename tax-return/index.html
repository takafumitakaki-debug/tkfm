<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>確定申告ナビ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-head">
    <div class="brand">確定申告ナビ <span>会社員＋副業・控除</span></div>
    <div class="head-actions">
      <label class="year-pick">年分
        <select id="year"></select>
      </label>
      <button id="btn-backup" title="入力データを JSON で保存">バックアップ</button>
      <button id="btn-restore" title="バックアップした JSON を読み込む">復元</button>
      <button id="btn-print" title="計算結果と転記ガイドを印刷">印刷</button>
      <input type="file" id="restore-input" accept="application/json,.json" hidden>
    </div>
  </header>

  <div class="summary-bar" id="summary"></div>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <main id="main"></main>

  <footer class="app-foot">
    入力はこのブラウザの中だけに保存され、外部には送信されません。計算は一般的な会社員＋副業のケースを対象にした概算です。
    最終的な金額は国税庁「確定申告書等作成コーナー」で確認してください。
  </footer>

  <dialog id="csv-dialog"></dialog>

  <script src="js/rules.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
